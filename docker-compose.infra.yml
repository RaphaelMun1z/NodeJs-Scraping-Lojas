services:
    mongodb:
        image: mongo:8.0
        container_name: scraping-lojas-mongodb-local
        restart: unless-stopped
        ports:
            - "27018:27017"
        volumes:
            - scraping_lojas_dados_local:/data/db
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' --host localhost | grep 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
        container_name: scraping-lojas-elasticsearch-local
        restart: unless-stopped
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
        ports:
            - "9200:9200"
        volumes:
            - scraping_lojas_elasticsearch_local:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS http://localhost:9200/_cluster/health >/dev/null",
                ]
            interval: 15s
            timeout: 10s
            retries: 10

volumes:
    scraping_lojas_dados_local:
    scraping_lojas_elasticsearch_local:
