<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Produtos coletados de múltiplas lojas" />
    <title>Live Promo · Produtos</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/">Live Promo</a>
        <form class="searchbar" id="search-form">
          <input id="search-input" type="search" placeholder="iPhone 17 Pro Max..." autocomplete="off" />
          <button type="submit">Buscar</button>
          <div id="search-suggestions" class="search-suggestions is-hidden" role="listbox" aria-label="Sugestões de produtos"></div>
        </form>
        <div class="account-area"><button id="account-avatar" class="account-avatar account-login-button" type="button" aria-label="Entrar">Entrar</button><div id="account-menu" class="account-menu is-hidden"><button id="account-monitoring" type="button">Scrapings</button><button id="account-settings" type="button">Configurações</button><button id="account-logout" type="button">Sair</button></div></div>
      </header>

      <nav class="categorybar" aria-label="Categorias">
        <button class="category-link is-active" type="button" data-category="">Todos</button>
        <button class="category-link" type="button" data-category="notebook">Notebooks</button>
        <button class="category-link" type="button" data-category="placa de vídeo">Placas de vídeo</button>
        <button class="category-link" type="button" data-category="monitor">Monitores</button>
        <button class="category-link" type="button" data-category="gamer">Gamer</button>
        <span class="category-spacer"></span>
      </nav>

      <main class="content-layout">
        <aside class="filters-panel">
          <div class="filters-heading"><h1>Filtros</h1><button id="clear-filters" class="text-button" type="button">Limpar</button></div>

          <section class="filter-section">
            <h2>Categoria</h2>
            <div class="radio-list" id="category-filter">
              <div class="filter-skeleton"><span class="skeleton skeleton-line short"></span><span class="skeleton skeleton-line medium"></span><span class="skeleton skeleton-line short"></span></div>
            </div>
          </section>

          <section class="filter-section">
            <h2>Fonte</h2>
            <div class="radio-list" id="source-filter">
              <label class="radio-row"><input type="radio" name="source" value="" checked /> Todas as fontes</label>
            </div>
          </section>

          <section class="filter-section">
            <h2>Preço</h2>
            <div class="price-slider">
              <div class="range-values"><span id="min-price-label">R$ 0</span><span id="max-price-label">Sem limite</span></div>
              <label class="range-label" for="min-price">Preço mínimo</label>
              <div class="dual-range" aria-label="Faixa de preco">
                <div class="dual-range-track"></div>
                <input id="min-price" type="range" min="0" max="20000" step="50" value="0" aria-label="Preco minimo" />
              <label class="range-label" for="max-price">Preço máximo</label>
                <input id="max-price" type="range" min="0" max="20000" step="50" value="20000" aria-label="Preco maximo" />
              </div>
            </div>
          </section>
          <section class="filter-section">
            <h2>Status</h2>
            <label class="check-row"><input id="only-active" type="checkbox" checked /> Somente ativos</label>
          </section>
        </aside>

        <section class="products-area" aria-live="polite">
          <div class="toolbar">
            <div class="toolbar-summary"><span id="result-status" class="result-status">Carregando produtos...</span><div id="active-filters" class="active-filters"></div></div>
            <label class="sort-control"><span>Ordenar por</span><select id="sort-filter"><option value="desconto" selected>Maior desconto</option><option value="recent">Mais recentes</option><option value="price-asc">Menor preço</option><option value="price-desc">Maior preço</option></select></label>
          </div>
          <div id="loading" class="empty-state"><div class="skeleton loading-skeleton"></div></div>
          <div id="products-grid" class="products-grid"></div>
          <div id="empty" class="empty-state is-hidden">Nenhum produto encontrado com esses filtros.</div>
          <nav class="pagination" id="pagination" aria-label="Paginação"></nav>
        </section>
      </main>
      <section id="new-products" class="new-products is-hidden" aria-labelledby="new-products-title">
        <div class="section-heading">
          <div><span class="section-kicker">Destaque</span><h2 id="new-products-title">Novidades</h2></div>
          <div class="new-products-controls" aria-label="Paginação das novidades">
            <button id="new-products-previous" class="page-button" type="button" aria-label="Novidades anteriores"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
            <span id="new-products-page" class="new-products-page"></span>
            <button id="new-products-next" class="page-button" type="button" aria-label="Próximas novidades"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="new-products-grid" class="new-products-grid"></div>
        <div class="new-products-end" aria-hidden="true"><span>Fim das novidades</span></div>
      </section>
      <section id="product-detail" class="product-detail is-hidden"></section>
      <div id="admin-shell" class="admin-shell is-hidden">
        <aside id="admin-sidebar" class="admin-sidebar" aria-label="Navegação administrativa">
          <div class="admin-sidebar-heading"><strong>Administração</strong></div>
          <nav class="admin-sidebar-nav">
            <a href="#admin" data-admin-nav="admin"><span aria-hidden="true"><i data-lucide="settings"></i></span> Configurações</a>
            <a href="#admin/scraping" data-admin-nav="admin/scraping" data-requer-fonte><span aria-hidden="true"><i data-lucide="monitor"></i></span> Monitoramento</a>
            <a href="#admin/autenticacao" data-admin-nav="admin/autenticacao"><span aria-hidden="true"><i data-lucide="shield-check"></i></span> Autenticação</a>
            <a href="#admin/busca" data-admin-nav="admin/busca" data-requer-fonte><span aria-hidden="true"><i data-lucide="search"></i></span> Busca manual</a>
            <a href="#admin/sistema" data-admin-nav="admin/sistema" data-requer-fonte><span aria-hidden="true"><i data-lucide="server-cog"></i></span> Sistema</a>
          </nav>
          <a class="admin-sidebar-back" href="#"><span aria-hidden="true"><i data-lucide="arrow-left"></i></span> Voltar aos produtos</a>
          <button id="admin-sidebar-logout" class="admin-sidebar-logout" type="button"><span aria-hidden="true"><i data-lucide="log-out"></i></span> Sair</button>
        </aside>
        <section id="admin-page" class="admin-page"></section>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
